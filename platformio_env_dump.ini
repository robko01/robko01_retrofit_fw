[env:env_dump]
platform = espressif32@6.4.0
board = esp32doit-devkit-v1

; Build flags parameters injection (values come from .env via pre_build.py).
build_flags =
  -D BUILD_NAME=\"ENV_DUMP\"
  -D BUILD_VERSION=\"01.00\"
  -D ENABLE_ENV_DUMP=1
  -D ENV_DUMP_ON_BOOT=1

; Local Serial port uploader.
upload_protocol = esptool
